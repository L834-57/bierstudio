# Normales Docker / Docker Compose:  docker compose up -d --build
services:
  bierstudio:
    build: .
    image: bierstudio:latest
    container_name: bierstudio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Berlin
      PUID: "3100"   # Benutzer, dem ./data gehören soll
      PGID: "3100"
      # Kontakt für Open Food Facts / Wikidata (alternativ in der App unter „Mehr“):
      # OFF_CONTACT: du@example.de
    volumes:
      - ./data:/data
