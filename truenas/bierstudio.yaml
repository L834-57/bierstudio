# Bierstudio für TrueNAS SCALE 24.10+ → Apps → Discover Apps → ⋮ → „Install via YAML“, Name: bierstudio
# Einfach einfügen: TrueNAS legt den Speicher (Volume „bierstudio-data“) selbst an.
services:
  bierstudio:
    image: ghcr.io/l834-57/bierstudio:latest
    restart: unless-stopped
    ports:
      - "8000:8000"                # links ggf. anderen freien Port, z. B. "8420:8000"
    volumes:
      - bierstudio-data:/data      # eigenes Dataset statt Volume: - /mnt/tank/bierstudio:/data
    environment:
      TZ: Europe/Berlin

volumes:
  bierstudio-data:
