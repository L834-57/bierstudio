# Alternative: fertiges Image aus der GitHub Container Registry (gebaut von .github/workflows/docker.yml).
# Einmalig nötig: auf GitHub unter „Packages → bierstudio → Package settings“ die Sichtbarkeit auf „Public“ stellen.
services:
  bierstudio:
    image: ghcr.io/l834-57/bierstudio:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PUID: "3100"
      PGID: "3100"
      # OFF_CONTACT: du@example.de
    ports:
      - "8000:8000"
    volumes:
      - /mnt/tank/bierstudio:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    networks:
      - bierstudio

networks:
  bierstudio:
    name: bierstudio
